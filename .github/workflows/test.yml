name: Test

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - '.github/workflows/test.yml'
  schedule:
    - cron:  '0 0 1 * *'
jobs:
  test:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Setup dotnet
      uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2
      with:
        dotnet-version: 10.x

    - name: Build projects
      working-directory: ./src
      run: dotnet build

    - name: Run unit tests
      working-directory: ./src
      run: dotnet test